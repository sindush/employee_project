<section class="page">
  <header class="page-header">
    <h1>Employees</h1>
    <button type="button" (click)="onAddEmployee()">Add employee</button>
  </header>

  @if (loading) {
    <p>Loading...</p>
  }
  @if (error) {
    <p class="error">{{ error }}</p>
  }

  <div class="card-grid">
    @for (emp of employees; track emp.id) {
      <article class="card">
        <h2>{{ emp.name }}</h2>
        <p><strong>Department:</strong> {{ emp.department }}</p>
        <p><strong>Role:</strong> {{ emp.role }}</p>
        <p><strong>Phone:</strong> {{ emp.phone }}</p>
        <div class="card-actions">
          <button type="button" (click)="onViewEmployee(emp.id!)">View</button>
          <button type="button" class="danger" (click)="onDeleteEmployee(emp.id!)">Delete</button>
        </div>
      </article>
    } @empty {
      <p>No employees yet. Click Add to create one.</p>
    }
  </div>
</section>
